# This patch exposes the operator's metrics endpoint directly
# without kube-rbac-proxy sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: operator
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8443"
            - "--leader-elect"
          ports:
            - containerPort: 8443
              protocol: TCP
              name: https
